name: Build LarrkMod Tweak

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile LarrkMod.dylib
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect iOS SDK Environment
        run: |
          echo "Xcode Developer Directory:"
          xcode-select -p
          echo "iOS SDK Path:"
          xcrun -sdk iphoneos --show-sdk-path
          echo "iOS SDK Version:"
          xcrun -sdk iphoneos --show-sdk-version

      - name: Compile LarrkMod.dylib (arm64)
        run: |
          SDK_PATH=$(xcrun -sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos clang++ \
            -dynamiclib \
            -arch arm64 \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -Isrc \
            -framework UIKit \
            -framework Foundation \
            -framework QuartzCore \
            -framework CoreGraphics \
            -framework AudioToolbox \
            -framework Security \
            -Wl,-install_name,@executable_path/Frameworks/LarrkMod.dylib \
            -O2 \
            src/*.mm src/*.c \
            -o LarrkMod.dylib

      - name: Ad-Hoc Sign Binary & Verify
        run: |
          codesign -f -s - LarrkMod.dylib
          echo "--- Binary File Info ---"
          file LarrkMod.dylib
          echo "--- Linked Mach-O Libraries ---"
          otool -L LarrkMod.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LarrkMod.dylib
          path: LarrkMod.dylib
          if-no-files-found: error
          retention-days: 90

      - name: Create or Update GitHub Release (v1.0.0)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "LarrkMod v1.0.0 for Telegram & Swiftgram (Jailed iOS 18)"
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body: |
            ### ⚡ LarrkMod iOS Tweak for Telegram & Swiftgram (`ph.telegra.Telegraph` / `app.swiftgram.ios`)
            
            Автоматическая облачная сборка динамической библиотеки `LarrkMod.dylib` (архитектура `arm64`, чистый Objective-C++ без сторонних зависимостей, совместимо с Sideloadly и ESign).
            
            #### 🛠 Встроенный Jailed Sideload Fix (Официальный Telegram 13.0 & Swiftgram):
            - **Спуфинг Bundle ID:** для главного бандла возвращается `ph.telegra.Telegraph`, защищая от сбоев при смене Team ID и подписи в Sideloadly/ESign.
            - **Перенаправление AppGroup Container:** гарантированное создание и редирект в `<Documents>/AppGroup/telegram-data`.
            - **Перенаправление NSUserDefaults Suite:** автоматический редирект сьютов `group.*`, `telegraph` и `telegram` в `standardUserDefaults`.
            - **Безопасный Keychain через Fishhook:** перехват `SecItemAdd`, `SecItemCopyMatching`, `SecItemUpdate`, `SecItemDelete` только для бинарников внутри `.app/`, удаление `kSecAttrAccessGroup` / `agrp`, замена `kSecAttrAccessible` на `kSecAttrAccessibleAfterFirstUnlock`.
            - **Автоматический Fallback:** при ошибках доступа к Keychain (-34018) сессия авторизации сохраняется в `Documents/keychain_fallback.plist` и возвращается `errSecSuccess`, исключая падения на `abort()`.
            - **Блокировка баннеров сторонних сайтов:** подавление сторонних рекламных окон (`FCAlertView`, `iOSGods`, `ArmConverter`, `JHBannerView`).
            
            #### 🚀 Возможности твика:
            - **Анти-Удаление сообщений:** удаленные сообщения сохраняются в переписке и выделяются полупрозрачным стилем (`alpha = 0.45`).
            - **Ghost Mode (8 статусов):**
              - Отключение Онлайн-Статуса (`account.updateStatus offline`)
              - Отключение статуса ввода текста (Typing)
              - Отключение статусов записи и загрузки видео / кружочков
              - Отключение статусов записи и отправки голосовых сообщений
              - Отключение статусов отправки фото и файлов
            - **Локальный Telegram Premium:** клиентская разблокировка звездочки в профиле и премиум-функций.
            - **Локальный NFT-профиль:** кастомный NFT-бейдж (`Pool Float`, `Plush Pepe`, `Durov's Cap`, `Astral Shard` или кастомное фото), выбор неонового градиента шапки и паттерн-эмодзи.
            - **Локальные Telegram Stars ⭐:** визуальная подмена баланса звезд во всех экранах Telegram.
            
            #### 📱 Активация меню в приложении:
            1. Зажмите область таббара на вкладке **«Чаты»**.
            2. Через 1 секунду появится неоновый HUD с ползунком `"Удерживайте еще 3 сек для LarrkMod..."`.
            3. Удерживайте палец до 100% — меню откроется с виброоткликом!
            
            #### 🛠 Установка через Sideloadly / ESign:
            1. Скачайте `.ipa` Telegram или Swiftgram и прикрепленный файл `LarrkMod.dylib`.
            2. В Sideloadly (Advanced Options -> Dylibs) или в ESign добавьте `LarrkMod.dylib`.
            3. Подпишите и установите на устройство.
          files: |
            LarrkMod.dylib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
